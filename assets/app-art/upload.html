<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change app image - Refract</title>
<style>
:root { color-scheme: dark; font-family: system-ui, sans-serif; background: #131821; color: #f5f7fc; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
main { width: min(100%, 480px); }
.brand { color: #b9c8e5; font-size: 15px; font-weight: 700; letter-spacing: .08em; }
h1 { font-size: clamp(32px, 8vw, 44px); line-height: 1.1; margin: 28px 0 12px; letter-spacing: -.025em; }
p { line-height: 1.55; color: #c2cbdc; margin: 0 0 24px; }
label { display: block; margin-bottom: 10px; font-weight: 600; }
input { display: block; width: 100%; padding: 14px; border: 1px solid #77849b; border-radius: 12px; background: #222b39; color: #fff; font: inherit; }
input::file-selector-button { border: 0; border-radius: 7px; padding: 9px 12px; margin-right: 12px; background: #dbe6ff; color: #14233c; font-weight: 700; }
button { margin-top: 18px; width: 100%; border: 0; border-radius: 12px; padding: 15px; background: #a9c6ff; color: #10213b; font: inherit; font-weight: 750; cursor: pointer; }
button:disabled { opacity: .55; cursor: default; }
:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
#status { min-height: 2em; margin-top: 18px; color: #dce8ff; }
</style>
</head>
<body><main>
<div class="brand">REFRACT</div>
<h1>Change app image</h1>
<p>Choose a JPG or PNG image. Refract will update the app you selected on your TV.</p>
<form id="upload"><label for="image">Image, up to 16 MB</label><input id="image" type="file" accept="image/jpeg,image/png" required><button id="send" type="submit">Send to TV</button></form>
<p id="status" role="status" aria-live="polite"></p>
</main><script>
const form = document.querySelector('#upload'), file = document.querySelector('#image'), button = document.querySelector('#send'), status = document.querySelector('#status');
form.addEventListener('submit', async event => {
  event.preventDefault();
  if (!file.files.length) return;
  if (file.files[0].size > 16 * 1024 * 1024) { status.textContent = 'Choose an image smaller than 16 MB.'; return; }
  button.disabled = true; status.textContent = 'Sending image...';
  try {
    const response = await fetch(location.pathname, {method: 'POST', body: file.files[0], headers: {'Content-Type': 'application/octet-stream'}});
    if (!response.ok) { status.textContent = 'Could not use that image. Choose a JPG or PNG and try again.'; button.disabled = false; return; }
    status.textContent = 'Done! Your TV has the new image.'; button.textContent = 'Image sent'; file.disabled = true;
  } catch (_) { status.textContent = 'Could not reach the TV. Keep the TV screen open and try again.'; button.disabled = false; }
});
</script></body></html>
