name: Signed custom APK

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refract-signed-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test release and migration safeguards
        run: python3 -m unittest discover -s tools/tests -v
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android SDK packages
        run: sdkmanager 'build-tools;36.0.0' 'platforms;android-35'
      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.REFRACT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.REFRACT_KEYSTORE_PASSWORD }}
          REFRACT_SIGNING_DIR: ${{ runner.temp }}/refract-signing
        run: |
          umask 077
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD"
          mkdir -p "$REFRACT_SIGNING_DIR"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$REFRACT_SIGNING_DIR/release.p12"
          printf '%s\n' "$KEYSTORE_PASSWORD" > "$REFRACT_SIGNING_DIR/password"
      - name: Build and verify APK
        env:
          GH_TOKEN: ${{ github.token }}
          REFRACT_SIGNING_DIR: ${{ runner.temp }}/refract-signing
          VERSION_NAME: ${{ github.event.release.tag_name }}
        run: ./build.sh
      - name: Attach APK, checksum, and version metadata to published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" build/refract-custom.apk build/SHA256SUMS build/release.json --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: refract-custom-apk
          path: |
            build/refract-custom.apk
            build/SHA256SUMS
            build/release.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing material
        if: always()
        env:
          REFRACT_SIGNING_DIR: ${{ runner.temp }}/refract-signing
        run: rm -rf -- "$REFRACT_SIGNING_DIR"
